name: Generate Contribution Skyline

on:
  # 12時間ごとに自動実行
  schedule:
    - cron: "0 */12 * * *"
  
  # 手動実行を許可
  workflow_dispatch:
  
  # mainブランチにpushされた時も実行
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4

      # コントリビューションを夜景都市SVGに変換
      - name: Generate skyline SVGs
        run: python3 scripts/skyline.py souta-pqr dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # outputブランチに結果をpush
      - name: Push skyline SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          